[build]
  command = "pnpm build"
  publish = "dist"

# SPA fallback (safe even without routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


# Security headers. The CSP is deliberately strict: everything the site needs
# (JS bundle, fonts, images, the contact-form POST) is same-origin. Emotion/MUI
# inject styles at runtime, hence 'unsafe-inline' for style-src only.
[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
