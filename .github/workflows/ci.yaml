name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run cv:check

  lighthouse:
    # Perf budgets are asserted against the production build (see lighthouserc.json).
    # Only on PRs and main — a full Lighthouse run per feature-branch push isn't worth the minutes.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          # Lighthouse audits this as a stand-in for the real production build, which is the
          # only deploy context vite.config.ts marks indexable — without this, the noindex
          # meta tag added for non-production contexts fails the SEO category assertion.
          CONTEXT: production
      - run: pnpm exec lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14
