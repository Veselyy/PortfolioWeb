name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          # TEMP: debug failing runs (is_error:true after ~2s); revert after reading the error
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR. Focus on:
            - Correctness and potential bugs
            - TypeScript/React best practices and security issues
            - SEO: meta tags, semantic HTML, Open Graph, structured data,
              canonical URLs, alt attributes, page titles, heading hierarchy (h1-h6)
            - Accessibility (WCAG 2.1 AA / axe rules): ARIA roles and labels,
              keyboard navigation, focus management, color contrast, form labels,
              interactive element roles, screen reader compatibility
            Be concise. Post comments inline where relevant.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
