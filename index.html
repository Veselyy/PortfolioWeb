<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <!-- 64px PNG rather than the source SVG: the artwork is a vectorised portrait whose
         shading paths weighed 128 kB, none of which is legible at the 16-32 px a favicon
         is actually drawn at. 64px covers 32 CSS px on a 2x display. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Both subsets are preloaded: Czech copy needs latin for the bulk of the text and
         latin-ext for the diacritics, and the ext file would otherwise not be discovered
         until text renders. crossorigin is required on font preloads even same-origin. -->
    <link
      rel="preload"
      href="/fonts/figtree-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/figtree-latin-ext-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>%SEO_TITLE%</title>
    <meta name="robots" content="%SEO_ROBOTS%" />
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <link rel="canonical" href="https://martinvesely.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Martin Veselý — Portfolio" />
    <meta property="og:title" content="%SEO_OG_TITLE%" />
    <meta property="og:description" content="%SEO_OG_DESCRIPTION%" />
    <meta property="og:image" content="%SEO_OG_IMAGE%" />
    <meta property="og:url" content="https://martinvesely.netlify.app/" />
    <meta property="og:locale" content="cs_CZ" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_OG_TITLE%" />
    <meta name="twitter:description" content="%SEO_OG_DESCRIPTION%" />
    <meta name="twitter:image" content="%SEO_OG_IMAGE%" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Martin Veselý",
        "jobTitle": "%SEO_JOB_TITLE%",
        "url": "https://martinvesely.netlify.app/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Static shadow form so Netlify's build-time crawler registers the "contact" form and its fields (the real form is rendered client-side by React and invisible to that crawler). -->
    <form name="contact" data-netlify="true" hidden>
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
