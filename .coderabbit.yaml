# CodeRabbit configuration — https://docs.coderabbit.ai/reference/configuration
language: 'en-US'

reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - '!dist/**'
    - '!pnpm-lock.yaml'
    - '!**/*.pdf'
    - '!**/*.png'
    - '!**/*.jpg'
    - '!**/*.svg'
    - '!cv/vesely_martin_cv.md' # generated by `pnpm cv:generate`, reviewed via its source content instead
  path_instructions:
    - path: 'src/**/*.tsx'
      instructions: >
        React 19 + TypeScript function components only. Styles are CSS Modules or MUI/Emotion
        `sx` — flag any Tailwind usage. Check for typed props (strict mode), colocated styles,
        and avoidable prop-drilling.
    - path: 'src/**/*.test.ts?(x)'
      instructions: >
        Jest + React Testing Library. Tests should cover risky logic/edge cases, not exist for
        coverage's sake. Flag DOM-implementation-detail assertions over user-facing behavior.
    - path: 'e2e/**/*.spec.ts'
      instructions: >
        Playwright e2e tests follow a Page Object Model: locators and page actions belong in
        `e2e/pages/*.ts` classes, specs should only call POM methods/locators and hold
        `expect()` assertions plus test-only data. Flag any raw `page.locator()`/`page.goto()`
        calls inlined directly in a spec file.
    - path: 'scripts/**'
      instructions: >
        CV generation scripts (`generate-cv.ts` and friends) must keep `cv/vesely_martin_cv.md`
        and the CV-FE/CV-BE/CV-SUPP variants in sync with `about-me.md` + `src/data/`. Watch for
        relative-path assumptions that break when the script's input/output locations change.

chat:
  auto_reply: true
